# **5. `forward_list` Operations**







A **`forward_list`** is a **singly linked list** that supports **fast insertions and deletions** but **only forward traversal**.







### **Common Operations:**







| Operation                | Description                                                   | Example                            |



| ------------------------ | ------------------------------------------------------------- | ---------------------------------- |



| `push_front(val)`        | Adds an element at the front                                  | `fl.push_front(10);`               |



| `pop_front()`            | Removes the first element                                     | `fl.pop_front();`                  |



| `insert_after(pos, val)` | Inserts an element after a given position                     | `fl.insert_after(fl.begin(), 20);` |



| `erase_after(pos)`       | Removes an element after a given position                     | `fl.erase_after(fl.begin());`      |



| `remove(val)`            | Removes all elements matching a value                         | `fl.remove(30);`                   |



| `size()`                 | Returns the number of elements (Not available, must use loop) | -                                  |







#### **Example Code:**







```cpp



#include <iostream>



#include <forward_list>



using namespace std;







int main() {



    forward_list<int> fl = {10, 20, 30};



    fl.push_front(5); // Insert at front



    fl.insert_after(fl.begin(), 15); // Insert 15 after the first element







    for (int num : fl) {



        cout << num << " ";



    }



    return 0;



}



```







**Output:**  



`5 15 10 20 30`







---







### **Conclusion**







Each **sequence container** in C++ STL has unique properties and operations suited for different use cases. If you need **fast random access**, use `vector`. If frequent insertions/deletions are needed, use `list` or `deque`.

# 1.2 Associative Containers







## **What Are Associative Containers?**







Associative containers in C++ are specialized data structures designed for **fast retrieval, storage, and manipulation of key-value pairs or ordered/unordered elements**. Unlike sequence containers (`vector`, `list`, etc.), they use **self-balancing binary search trees (like Red-Black trees) or hash tables** to ensure efficient insertions, deletions, and lookups.







### **Why Use Associative Containers Over Basic Data Structures?**







1. **Faster Lookups:** Unlike arrays or linked lists, which require O(n) time for searching, associative containers provide O(log n) or even O(1) lookups.



2. **Auto-Sorting:** `map` and `set` keep elements sorted automatically, eliminating the need for manual sorting.



3. **Unique Key Storage:** `set` and `map` ensure elements or keys are unique, preventing duplicates.



4. **Efficient Insertions & Deletions:** Unlike vectors (O(n) for insertions/deletions in the middle), associative containers often provide O(log n) or O(1) efficiency.







---







## **Types of Associative Containers**







C++ STL provides four main associative containers:







1. **`set`** – Stores unique, ordered elements.



2. **`multiset`** – Stores ordered elements, but allows duplicates.



3. **`map`** – Stores unique key-value pairs in a sorted order.



4. **`multimap`** – Stores key-value pairs but allows duplicate keys.







Let’s explore each with their operations and examples.







---







## **1. `set` Operations**







A **set** stores **unique elements** in **sorted order** and provides **O(log n) operations** using a **Red-Black tree**.







### **Common Operations**







| Operation     | Description                               | Example         |



| ------------- | ----------------------------------------- | --------------- |



| `insert(val)` | Inserts an element                        | `s.insert(30);` |



| `erase(val)`  | Removes an element                        | `s.erase(30);`  |



| `find(val)`   | Returns iterator if found, else `s.end()` | `s.find(20);`   |



| `count(val)`  | Returns 1 if found, 0 if not              | `s.count(10);`  |



| `size()`      | Returns number of elements                | `s.size();`     |



| `empty()`     | Checks if set is empty                    | `s.empty();`    |







### **Example Code**







```cpp



#include <iostream>



#include <set>



using namespace std;







int main() {



    set<int> s = {10, 20, 30};



    s.insert(40);  // Insert element



    s.erase(20);   // Remove element







    for (int num : s) {



        cout << num << " ";



    }



    return 0;



}



```







**Output:**  



`10 30 40`







---







## **2. `multiset` Operations**







A **multiset** is similar to `set`, but **allows duplicate values**.







### **Common Operations**







| Operation     | Description                              | Example          |



| ------------- | ---------------------------------------- | ---------------- |



| `insert(val)` | Inserts an element                       | `ms.insert(30);` |



| `erase(val)`  | Removes all instances of a value         | `ms.erase(30);`  |



| `count(val)`  | Returns count of a value                 | `ms.count(10);`  |



| `find(val)`   | Returns iterator to the first occurrence | `ms.find(20);`   |







### **Example Code**







```cpp



#include <iostream>



#include <set>



using namespace std;







int main() {



    multiset<int> ms = {10, 20, 30, 20}; // Allows duplicate 20



    ms.insert(30);







    for (int num : ms) {



        cout << num << " ";



    }



    return 0;



}



```







**Output:**  



`10 20 20 30 30`







---







## **3. `map` Operations**







A **map** is a key-value container where **keys are unique and sorted** automatically.







### **Common Operations**







| Operation              | Description                              | Example                  |



| ---------------------- | ---------------------------------------- | ------------------------ |



| `insert({key, value})` | Inserts key-value pair                   | `m.insert({1, "John"});` |



| `erase(key)`           | Removes an element by key                | `m.erase(2);`            |



| `find(key)`            | Returns iterator to element if found     | `m.find(3);`             |



| `at(key)`              | Accesses element by key                  | `m.at(1);`               |



| `operator[key]`        | Accesses value, inserts if key not found | `m[4] = "New";`          |







### **Example Code**







```cpp



#include <iostream>



#include <map>



using namespace std;







int main() {



    map<int, string> m;



    m[1] = "Alice";



    m[2] = "Bob";



    m.insert({3, "Charlie"});







    for (auto& [key, value] : m) {



        cout << key << ": " << value << endl;



    }



    return 0;



}



```







**Output:**







```



1: Alice



2: Bob



3: Charlie



```







---







## **4. `multimap` Operations**







A **multimap** is like `map`, but **allows duplicate keys**.







### **Common Operations**







| Operation              | Description                            | Example                    |



| ---------------------- | -------------------------------------- | -------------------------- |



| `insert({key, value})` | Inserts key-value pair                 | `mm.insert({1, "Japan"});` |



| `erase(key)`           | Removes all instances of key           | `mm.erase(2);`             |



| `find(key)`            | Returns iterator to first matching key | `mm.find(3);`              |



| `count(key)`           | Returns number of occurrences          | `mm.count(1);`             |







### **Example Code**







```cpp



#include <iostream>



#include <map>



using namespace std;







int main() {



    multimap<int, string> mm;



    mm.insert({1, "Arjun"});



    mm.insert({2, "Bhavin"});



    mm.insert({1, ""}); // Duplicate key 1 allowed







    for (auto& [key, value] : mm) {



        cout << key << ": " << value << endl;



    }



    return 0;



}



```







**Output:**







```



1: Arjun



1: 



2: Bhavin



```







---







# **Summary: When to Use Which?**







| Container  | Unique Elements? | Ordered? | Allows Key-Value? | Best For                        |



| ---------- | ---------------- | -------- | ----------------- | ------------------------------- |



| `set`      | ✅ Yes           | ✅ Yes   | ❌ No             | Unique elements, fast lookup    |



| `multiset` | ❌ No            | ✅ Yes   | ❌ No             | Sorted elements with duplicates |



| `map`      | ✅ Yes           | ✅ Yes   | ✅ Yes            | Unique key-value pairs          |



| `multimap` | ❌ No            | ✅ Yes   | ✅ Yes            | Duplicate key-value pairs       |







---







Associative containers provide an **efficient alternative to basic data structures** when working with sorted, unique, or key-value data. They are **more optimized than arrays, lists, and vectors** for **search-intensive operations**.







# **1.3 Unordered Containers in C++ STL**  







## **What Are Unordered Containers?**  



Unordered containers in C++ **store elements in an arbitrary order** and provide **faster lookup times** compared to ordered associative containers. Instead of using **Red-Black Trees**, they use **Hash Tables**, allowing most operations to be performed in **O(1) average time complexity** (compared to **O(log n)** for ordered containers).







### **Why Use Unordered Containers Over Ordered Ones?**  



1. **Faster Operations:** Since unordered containers use hash tables, insertions, deletions, and lookups are **O(1) on average**.  



2. **No Automatic Sorting:** Unlike `set` or `map`, elements are **not** stored in sorted order, making insertion and access **faster** when order doesn't matter.  



3. **Efficient for Large Data:** When dealing with large datasets, unordered containers significantly improve performance over ordered ones.  







---







## **Types of Unordered Containers**



C++ STL provides four main unordered containers:  



1. **`unordered_set`** – Stores unique elements with no specific order.  



2. **`unordered_multiset`** – Stores unordered elements, but allows duplicates.  



3. **`unordered_map`** – Stores unique key-value pairs in an unordered manner.  



4. **`unordered_multimap`** – Stores key-value pairs but allows duplicate keys.  







Let’s explore each with their operations and examples.







---

An **`unordered_set`** stores **unique elements** but in **no particular order**.

| `erase(val)` | Removes an element | `us.erase(30);` |



| `find(val)` | Returns iterator if found, else `us.end()` | `us.find(20);` |



| `count(val)` | Returns 1 if found, 0 if not | `us.count(10);` |



| `size()` | Returns number of elements | `us.size();` |



| `empty()` | Checks if set is empty | `us.empty();` |

    }



    return 0;



}

`101 103 104`

# **Comparison of Unordered vs Ordered Containers**



| Container | Unique Elements? | Ordered? | Allows Key-Value? | Average Lookup Time | Best For |



|-----------|----------------|---------|----------------|----------------|-----------|

| `unordered_multiset` | ❌ No | ❌ No | ❌ No | O(1) | Unordered duplicates |



| `unordered_map` | ✅ Yes | ❌ No | ✅ Yes | O(1) | Key-value lookup |

- If you need **fast lookups** and don’t care about **order**, use **unordered containers**.

  # **Iterators in C++ STL**







## **What Are Iterators?**







In C++, **iterators** act like **pointers** that are used to access elements in a **container** like `vector`, `list`, `set`, etc. They allow you to traverse through elements of containers in a uniform manner without needing to know the underlying structure or type of the container. Think of iterators as a mechanism that **encapsulates** the traversal logic of containers, providing an interface for accessing the container's elements.







In simpler terms, they allow you to loop over elements in a container, similar to how you would use a pointer to traverse through an array. However, iterators are much more powerful and flexible, supporting a wide variety of container types and access patterns.







### **Why Use Iterators?**



- **Unified Access:** Whether you're working with arrays, vectors, sets, or maps, iterators provide a consistent and uniform way to access elements across all these containers.



- **Abstraction:** They abstract away the details of the underlying data structure. You can write generic code that works for any container type.



- **Safety:** Iterators prevent direct memory manipulation, unlike pointers, which can lead to issues such as memory leaks, segmentation faults, etc.



- **Flexibility:** Iterators are capable of **moving forward**, **backward**, and even **jumping** across elements, depending on the type of iterator used.







### **Types of Iterators**



Iterators are classified based on their **capabilities**, such as the direction in which they can move (forward/backward), and whether they allow random access or not.







---







## **1. Input Iterators**







### **Characteristics**



- **Purpose:** Used for **read-only access** to the container.



- **Movement:** Can only move **forward**.



- **Behavior:** Only supports **single-pass iteration**, meaning you can only traverse through the container once. 



- **Examples:** `istream_iterator`, `ifstream` iterators (for reading input streams).







### **Common Operations**



| Function | Description | Example |



|----------|-------------|---------|



| `operator*()` | Dereferences the iterator to access the value it points to | `cout << *inputIt;` |



| `operator++()` | Advances the iterator to the next element | `++inputIt;` |



| `operator==` / `operator!=` | Compares two iterators to check equality or inequality | `inputIt != endIt;` |







### **Code Example**



```cpp



#include <iostream>



#include <iterator>



using namespace std;







int main() {



    cout << "Enter two student scores: ";



    istream_iterator<int> inputIt(cin); // Create input iterator



    int score1 = *inputIt;



    ++inputIt;



    int score2 = *inputIt;







    cout << "Scores: " << score1 << ", " << score2 << endl;



    return 0;



}



```



**Input:** `85 92`  



**Output:** `Scores: 85, 92`







### **Why Use Input Iterators?**



- Input iterators are designed for **stream-based input**. They're useful for reading from input streams like files or standard input (`cin`).



- **Efficiency**: Because input iterators move only forward, they provide minimal overhead when reading data once, making them ideal for scenarios like parsing files or input sequences.







---







## **2. Output Iterators**







### **Characteristics**



- **Purpose:** Used for **write-only access** to the container.



- **Movement:** Can only move **forward**.



- **Behavior:** Only supports **single-pass iteration**, meaning you can traverse through the container and write data to it once.



- **Examples:** `ostream_iterator` (for writing to output streams like `cout` or a file).







### **Common Operations**



| Function | Description | Example |



|----------|-------------|---------|



| `operator=()` | Assigns a value to the position the iterator points to | `*outputIt = 10;` |



| `operator++()` | Advances the iterator to the next element | `++outputIt;` |







### **Code Example**



```cpp



#include <iostream>



#include <iterator>



using namespace std;







int main() {



    ostream_iterator<string> outputIt(cout, "\n");



    *outputIt = "Jenil";



    *outputIt = "Mahir";



    *outputIt = "Yashvi";



    return 0;



}



```



**Output:**



```



Jenil  



Mahir  



Yashvi  



```







### **Why Use Output Iterators?**



- Output iterators are primarily used to send output to streams or containers. They provide a **consistent interface** to write data, regardless of the underlying container (e.g., writing to the console, files, etc.).



- Ideal for **streaming** data in real-time, especially when you are outputting data to files or the terminal.







---







## **3. Forward Iterators**







### **Characteristics**



- **Purpose:** Can **read and write** elements.



- **Movement:** Can only move **forward**, from one element to the next.



- **Behavior:** Can be used to **traverse through a container multiple times** in one direction.



- **Examples:** `forward_list` iterators, `unordered_set` iterators.







### **Common Operations**



| Function | Description | Example |



|----------|-------------|---------|



| `operator*()` | Dereferences the iterator to access the value | `cout << *it;` |



| `operator++()` | Advances the iterator to the next element | `++it;` |



| `operator==` / `operator!=` | Compares two iterators | `it != endIt;` |







### **Code Example**



```cpp



#include <iostream>



#include <forward_list>



using namespace std;







int main() {



    forward_list<string> subjects = {"Math", "Physics", "Chemistry"};



    forward_list<string>::iterator it;







    for (it = subjects.begin(); it != subjects.end(); ++it) {



        cout << *it << " ";



    }



    return 0;



}



```



**Output:**  



`Math Physics Chemistry`







### **Why Use Forward Iterators?**



- Forward iterators provide the ability to traverse through a container once, in one direction.



- They are often used with containers like `forward_list`, where elements are linked and only **one-directional traversal** is allowed.



- Suitable for **insertion or modification** of elements as we traverse.







---







## **4. Bidirectional Iterators**







### **Characteristics**



- **Purpose:** Can **read and write** elements.



- **Movement:** Can move **forward** and **backward**.



- **Behavior:** They provide the ability to **traverse both directions**—in contrast to forward iterators that only move in one direction.



- **Examples:** `list`, `set`, `map` iterators.







### **Common Operations**



| Function | Description | Example |



|----------|-------------|---------|



| `operator*()` | Dereferences the iterator to access the value | `cout << *it;` |



| `operator++()` | Advances the iterator to the next element | `++it;` |



| `operator--()` | Moves the iterator backward | `--it;` |



| `operator==` / `operator!=` | Compares two iterators | `it != endIt;` |







### **Code Example**



```cpp



#include <iostream>



#include <set>



using namespace std;







int main() {



    set<int> studentIDs = {101, 102, 103};



    set<int>::iterator it = studentIDs.end();



    



    while (it != studentIDs.begin()) {



        --it;



        cout << *it << " ";



    }



    return 0;



}



```



**Output:**  



`103 102 101`







### **Why Use Bidirectional Iterators?**



- Bidirectional iterators are ideal for **doubly-linked containers** like `list` and `set` because they allow you to **move both forward and backward**.  



- Useful for scenarios where you need to **traverse** a container in both directions (e.g., searching, reversing traversal).







---







## **5. Random Access Iterators**







### **Characteristics**



- **Purpose:** Can **read and write** elements.



- **Movement:** Can move **forward and backward**, and also can **jump arbitrary distances** (constant time movement).



- **Behavior:** Provides the ability to perform **random access** similar to array indexing.



- **Examples:** `vector`, `deque`, `array` iterators.







### **Common Operations**



| Function | Description | Example |



|----------|-------------|---------|



| `operator*()` | Dereferences the iterator to access the value | `cout << *it;` |



| `operator++()` | Advances the iterator to the next element | `++it;` |



| `operator--()` | Moves the iterator backward | `--it;` |



| `operator+()` | Moves the iterator forward by N elements | `it + 3;` |



| `operator-()` | Moves the iterator backward by N elements | `it - 2;` |



| `operator[]` | Accesses element by index | `it[2];` |







### **Code Example**



```cpp



#include <iostream>



#include <vector>



using namespace std;







int main() {



    vector<int> marks = {85, 90, 78, 92, 88};



    vector<int>::iterator it = marks.begin();







    cout << "First mark: " << *it << endl;



    cout << "Third mark: " << it[2] << endl;



    it += 3;



    cout << "Fourth mark: " << *it << endl;



    return 0;



}



```



**Output:**  



```



First mark: 85  



Third mark: 78  



Fourth mark: 92  



```







### **Why Use Random Access Iterators?**



- Random access iterators are ideal for containers like **`vector`** and **`deque`**, where you might need to **jump directly** to any index or access elements randomly in **constant time**.



- They provide maximum flexibility when working with **large datasets**, offering **efficient index-based access**.







---







## **Conclusion**







- Iterators in C++ offer a **consistent, flexible, and efficient way** to access container elements, abstracting the details of underlying data structures.



- Based on their capabilities, different types of iterators are used for different containers, from **`input/output`** iterators for stream-based input/output, to **`random access`** iterators for direct indexing and **bidirectional access** in more complex containers.







**Which Iterator Type is Right for Your Use Case?**



- Use **Input/Output iterators** for **stream-based operations** (e.g., reading from `cin` or writing to `cout`).



- Use **Forward iterators** for containers like **`forward_list`** that support only one-directional traversal.



- Use **Bidirectional iterators** for **`list`**, **`map`**, and **`set`** where you need to traverse both ways.



- Use **Random Access iterators** for **`vector`**, **`deque`**, and **`array`** when you need to **directly access elements** by index.







Iterators make your code **container-agnostic**, enabling clean, readable, and maintainable code that works across various data structures.











# **Introduction to Algorithms in C++ STL**







The **Standard Template Library (STL)** in C++ provides a powerful set of **containers**, **iterators**, and **algorithms**. While containers and iterators handle data storage and traversal, **algorithms** are designed to perform operations on data stored within these containers. The C++ STL includes a comprehensive set of built-in algorithms that work seamlessly with STL containers and iterators, allowing for a high degree of efficiency and ease in performing common tasks such as searching, sorting, and manipulating elements.







An **algorithm** is a sequence of steps or operations designed to solve a specific problem or perform a particular task, such as finding an element in a container, sorting a collection, or performing calculations. The benefit of using C++ STL algorithms is that they are **generic**, meaning they can work with any container type as long as the appropriate iterators are provided.







### **Why Use Algorithms in C++ STL?**







1. **Efficiency**: STL algorithms are optimized for performance, often utilizing well-known algorithmic techniques like binary search, quicksort, and merge sort.



2. **Generality**: STL algorithms can be applied to a wide range of containers, making the code more reusable and less dependent on container types.



3. **Ease of Use**: Instead of manually implementing common tasks like sorting or searching, you can simply call an STL algorithm, which abstracts the complexity and reduces boilerplate code.







---







## **Types of Algorithms in C++ STL**







C++ STL algorithms are categorized based on their functionality. The major categories include:







1. **Non-modifying algorithms**: These algorithms don't modify the elements in the container. Examples include `find()`, `count()`, `equal()`.



2. **Modifying algorithms**: These algorithms modify the elements in the container. Examples include `sort()`, `reverse()`, `transform()`.



3. **Sorting algorithms**: These algorithms are designed specifically to sort elements in containers. Examples include `sort()`, `stable_sort()`, `partial_sort()`.



4. **Searching algorithms**: These algorithms are designed to search for elements in a container. Examples include `find()`, `binary_search()`, `lower_bound()`.



5. **Numeric algorithms**: These algorithms perform mathematical operations on the elements in the container. Examples include `accumulate()`, `inner_product()`, `partial_sum()`.



6. **Heap operations**: These algorithms work with **heaps** (priority queues). Examples include `make_heap()`, `push_heap()`, `pop_heap()`.



7. **Partitioning algorithms**: These algorithms divide a container into two parts based on a predicate. Examples include `partition()`, `stable_partition()`.







---







## **Commonly Used STL Algorithms with Examples**







Here, we'll explore some of the most commonly used STL algorithms, providing detailed explanations and code examples.







### **1. `find()` - Searching for an Element**







The `find()` algorithm searches for the first occurrence of a given value within a container. It returns an iterator to the first occurrence of the value, or to the end of the container if the value is not found.







### **Code Example**







```cpp



#include <iostream>



#include <vector>



#include <algorithm>



using namespace std;







int main() {



    vector<int> scores = {85, 90, 78, 92, 88};







    // Search for the score 92



    auto it = find(scores.begin(), scores.end(), 92);







    if (it != scores.end()) {



        cout << "Found score: " << *it << endl;



    } else {



        cout << "Score not found" << endl;



    }







    return 0;



}



```







**Output**:







```



Found score: 92



```







### **2. `sort()` - Sorting Elements**







The `sort()` algorithm sorts the elements of a container in **ascending** order by default. It uses an efficient sorting algorithm like **quicksort** or **heapsort** internally, with an average time complexity of O(n log n).







### **Code Example**







```cpp



#include <iostream>



#include <vector>



#include <algorithm>



using namespace std;







int main() {



    vector<int> scores = {85, 90, 78, 92, 88};







    // Sort scores in ascending order



    sort(scores.begin(), scores.end());







    cout << "Sorted scores: ";



    for (const auto& score : scores) {



        cout << score << " ";



    }







    return 0;



}



```







**Output**:







```



Sorted scores: 78 85 88 90 92



```







### **3. `reverse()` - Reversing the Container**







The `reverse()` algorithm reverses the order of elements in a container. This operation is done **in-place** without creating a new container.







### **Code Example**







```cpp



#include <iostream>



#include <vector>



#include <algorithm>



using namespace std;







int main() {



    vector<int> scores = {85, 90, 78, 92, 88};







    // Reverse the order of scores



    reverse(scores.begin(), scores.end());







    cout << "Reversed scores: ";



    for (const auto& score : scores) {



        cout << score << " ";



    }







    return 0;



}



```







**Output**:







```



Reversed scores: 88 92 78 90 85



```







### **4. `accumulate()` - Summing Elements**







The `accumulate()` algorithm performs a **cumulative sum** or any other binary operation on a range of elements. By default, it sums up the elements, but you can provide a custom binary operation.







### **Code Example**







```cpp



#include <iostream>



#include <vector>



#include <numeric>



using namespace std;







int main() {



    vector<int> scores = {85, 90, 78, 92, 88};







    // Calculate the sum of scores

    cout << "Total score: " << total << endl;







    return 0;



}



```







**Output**:







```



Total score: 433



```







### **5. `binary_search()` - Searching for an Element in a Sorted Range**







The `binary_search()` algorithm checks if a given value exists in a sorted range. It performs a **binary search**, which is much more efficient than a linear search, with a time complexity of O(log n).







### **Code Example**







```cpp



#include <iostream>



#include <vector>



#include <algorithm>



using namespace std;







int main() {



    vector<int> scores = {78, 85, 88, 90, 92};  // Already sorted







    // Search for the score 90



    bool found = binary_search(scores.begin(), scores.end(), 90);







    if (found) {



        cout << "Found score 90" << endl;



    } else {



        cout << "Score 90 not found" << endl;



    }







    return 0;



}



```







**Output**:







```



Found score 90



```







### **6. `copy()` - Copying Elements from One Container to Another**







The `copy()` algorithm copies elements from one range into another range. It doesn't modify the original container.







### **Code Example**







```cpp



#include <iostream>



#include <vector>



#include <algorithm>



using namespace std;







int main() {



    vector<int> originalScores = {85, 90, 78, 92, 88};



    vector<int> copiedScores(5);







    // Copy elements from originalScores to copiedScores



    copy(originalScores.begin(), originalScores.end(), copiedScores.begin());







    cout << "Copied scores: ";



    for (const auto& score : copiedScores) {



        cout << score << " ";



    }







    return 0;



}



```







**Output**:







```



Copied scores: 85 90 78 92 88



```

### **7. `partial_sort()` - Partially Sorting a Container**







The `partial_sort()` algorithm sorts only the first `N` elements in a container, while keeping the rest of the elements in an unspecified order.







### **Code Example**



```cpp



#include <iostream>



#include <vector>



#include <algorithm>



using namespace std;

    }







    return 0;



}

```



Partially sorted scores: 78 85 88 92 90



```

### **8. `make_heap()` - Creating a Heap**







The `make_heap()` algorithm turns a container into a **heap**, a data structure that allows efficient retrieval of the maximum or minimum element (depending on heap type). By default, it creates a **max-heap**.







### **Code Example**



```cpp



#include <iostream>



#include <vector>



#include <algorithm>



using namespace std;







int main() {



    vector<int> scores = {85, 90, 78, 92, 88};







    // Create a max-heap from the scores



    make_heap(scores.begin(), scores.end());







    cout << "Heapified scores: ";



    for (const auto& score : scores) {



        cout << score << " ";



    }







    return 0;



}



```







**Output**:



```



Heapified scores: 92 90 78 85 88



```

### **9. `pop_heap()` - Removing the Root Element from a Heap**







The `pop_heap()` algorithm removes the root element of a heap (the maximum element in a max-heap or the minimum element in a min-heap) and places it at the end of the container.







### **Code Example**



```cpp



#include <iostream>



#include <vector>



#include <algorithm>



using namespace std;







int main() {



    vector<int> scores = {85, 90, 78, 92, 88};







    // Create a max-heap



    make_heap(scores.begin(), scores.end());







    // Remove the root element of the heap



    pop_heap(scores.begin(), scores.end());



    scores.pop_back();







    cout << "Heap after pop: ";



    for (const auto& score : scores) {



        cout << score << " ";



    }







    return 0;



}



```







**Output**:



```



Heap after pop: 90 88 78 85



```

### **10. `push_heap()` - Inserting an Element into a Heap**







The `push_heap()` algorithm inserts a new element into an existing heap and reorders the heap to maintain the heap property.

    }







    return 0;



}

### **11. `rotate()` - Rotating Elements in a Container**







The `rotate()` algorithm rotates the elements of a container by moving a specified range to the beginning. The elements before the specified position are moved to the end.

The `shuffle()` algorithm randomly rearranges the elements of a container. It requires a random number generator.

The `transform()` algorithm applies a unary operation (like a function) to each element in a range and stores the result in a destination range.

The STL provides a wide variety of algorithms to simplify common operations on containers. In addition to the basic operations like sorting and searching, you can use STL algorithms to modify containers, work with heaps, transform data, and more. These algorithms are highly optimized and work seamlessly with STL containers, allowing developers to write efficient, reusable, and clean code.







By utilizing these algorithms, you can focus on higher-level logic and avoid manually implementing common tasks, ultimately improving both the performance and readability of your C++ programs.















# Additional Features of STL







In addition to the algorithms, containers, and iterators, there are several other important features of the **C++ Standard Template Library (STL)** that can enhance your programming experience. 







---







### **1. Allocators**







**Allocators** are a low-level feature of the STL that handle memory management for containers. They provide a uniform way to manage dynamic memory. Allocators are used by most STL containers (like `vector`, `deque`, etc.) to allocate and deallocate memory. While not commonly used directly by most developers, understanding allocators can help you manage memory more efficiently when working with custom containers or when performance is critical.







- **Default Allocator:** `std::allocator` is the default memory allocator used by STL containers.



- **Custom Allocators:** You can create custom allocators to fine-tune memory allocation for your needs.







**Example:**







```cpp



#include <iostream>



#include <vector>



#include <memory>







int main() {



    std::allocator<int> alloc;



    int* ptr = alloc.allocate(5); // Allocates space for 5 integers







    // Construct objects in allocated space



    for (int i = 0; i < 5; ++i) {



        alloc.construct(&ptr[i], i + 1);



    }







    // Print values



    for (int i = 0; i < 5; ++i) {



        std::cout << ptr[i] << " ";



    }







    // Deconstruct and deallocate memory



    for (int i = 0; i < 5; ++i) {



        alloc.destroy(&ptr[i]);



    }



    alloc.deallocate(ptr, 5);







    return 0;



}



```







---







### **2. Functors (Function Objects)**







A **functor** is an object that can be called as if it were a function. Functors are objects of a class that overloads the `operator()`.







STL algorithms often accept functors (or function pointers) to customize their behavior. Functors provide greater flexibility and can maintain state across calls, which is not possible with regular functions.







**Example:**







```cpp



#include <iostream>



#include <vector>



#include <algorithm>







class Add {



public:



    Add(int x) : x_(x) {}



    int operator()(int y) const {



        return x_ + y;



    }



private:



    int x_;



};







int main() {



    std::vector<int> nums = {1, 2, 3, 4};







    // Using a functor with the transform algorithm



    std::transform(nums.begin(), nums.end(), nums.begin(), Add(10));







    for (int num : nums) {



        std::cout << num << " "; // Output: 11 12 13 14



    }







    return 0;



}



```







---







### **3. Pair and Tuple**







STL provides the **`pair`** and **`tuple`** classes, which allow you to store two or more related data elements in a single object.







- **`pair`:** It holds two elements of potentially different types.



- **`tuple`:** It can hold a fixed-size collection of elements of different types (more than two).







**Example of `pair`:**







```cpp



#include <iostream>



#include <utility>







int main() {



    // Create a pair of an integer and a string



    std::pair<int, std::string> p = {1, "CodingGita"};







    // Access elements



    std::cout << "First: " << p.first << ", Second: " << p.second << std::endl;



    



    return 0;



}



```







**Example of `tuple`:**







```cpp



#include <iostream>



#include <tuple>







int main() {



    // Create a tuple of three elements



    std::tuple<int, double, std::string> t = {1, 3.14, "Hello"};







    // Access elements using std::get



    std::cout << "First: " << std::get<0>(t) << ", Second: " << std::get<1>(t) << ", Third: " << std::get<2>(t) << std::endl;







    return 0;



}



```







---







### **4. Smart Pointers**







C++11 introduced **smart pointers** (`std::unique_ptr`, `std::shared_ptr`, and `std::weak_ptr`) to automatically manage the lifetime of dynamically allocated memory, preventing memory leaks.







- **`std::unique_ptr`**: Owns a resource, and only one unique pointer can point to the resource at any time.



- **`std::shared_ptr`**: Multiple shared pointers can share ownership of the same resource.



- **`std::weak_ptr`**: Doesn't affect the reference count, used for observing shared resources without extending their lifetime.







**Example of `std::unique_ptr`:**







```cpp



#include <iostream>



#include <memory>







class MyClass {



public:



    void display() { std::cout << "Hello from MyClass!" << std::endl; }



};







int main() {



    std::unique_ptr<MyClass> ptr = std::make_unique<MyClass>();







    ptr->display();







    return 0; // Automatically deallocates memory



}



```







---







### **5. `std::function` - A General-purpose Function Wrapper**







`std::function` is a versatile wrapper for functions, function pointers, lambda expressions, and other callable objects. It allows you to store and pass functions as arguments.







**Example:**







```cpp



#include <iostream>



#include <functional>







void display(int x) {



    std::cout << "Value: " << x << std::endl;



}







int main() {



    std::function<void(int)> func = display; // Function pointer







    func(10); // Call the function via std::function







    return 0;



}



```







---







### **6. `std::bind` - Binding Arguments to a Function**







`std::bind` allows you to create a new function object by binding certain arguments to a function. It is commonly used when you want to customize function calls for STL algorithms.







**Example:**







```cpp



#include <iostream>



#include <functional>







void display(int x, int y) {



    std::cout << "Sum: " << x + y << std::endl;



}







int main() {



    // Bind the first argument to 10, leaving the second argument free



    auto boundDisplay = std::bind(display, 10, std::placeholders::_1);







    boundDisplay(5);  // Outputs: Sum: 15







    return 0;



}



```







---







### **7. `std::priority_queue` - A Heap-based Container**







A **priority queue** is a container adapter that provides constant time access to the largest element. It works by maintaining the elements in a heap.







**Example:**







```cpp



#include <iostream>



#include <queue>







int main() {



    std::priority_queue<int> pq;



    



    pq.push(10);



    pq.push(30);



    pq.push(20);



    



    std::cout << "Top of the priority queue: " << pq.top() << std::endl; // Outputs 30







    return 0;



}



```







---







### **8. `std::array` - Fixed-Size Array**







Introduced in C++11, `std::array` is a container that wraps around regular arrays, providing better functionality (like size tracking and bounds checking).







**Example:**







```cpp



#include <iostream>



#include <array>







int main() {



    std::array<int, 5> arr = {1, 2, 3, 4, 5};







    std::cout << "Array elements: ";



    for (const auto& elem : arr) {



        std::cout << elem << " ";



    }







    return 0;



}



```







---







### **9. `std::vector<bool>` - Special Case of `std::vector`**







`std::vector<bool>` is a space-optimized version of `std::vector` where each element occupies only a single bit, instead of a full byte. It is specialized to store boolean values, providing a compact representation.







**Example:**







```cpp



#include <iostream>



#include <vector>







int main() {



    std::vector<bool> v = {true, false, true, true};







    for (const auto& val : v) {



        std::cout << val << " "; // Outputs: 1 0 1 1



    }







    return 0;



}



```







---







### **Conclusion**







The **STL** offers several powerful features beyond containers, iterators, and algorithms. Understanding **allocators**, **smart pointers**, **functors**, **pairs and tuples**, **`std::function`**, and other features like `std::priority_queue`, `std::array`, and `std::vector<bool>` will enable you to write more efficient and maintainable C++ code.







By exploring these advanced STL components, you can create more robust programs with improved memory management, flexibility, and performance.

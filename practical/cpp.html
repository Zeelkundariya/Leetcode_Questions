## **Protected Members and Access in Inheritance**  







### **What Are Protected Members?**  



In C++, a class can have **private, protected, and public** access specifiers that determine how its members (variables and functions) can be accessed.  







- **Private Members:** Can only be accessed inside the same class (not in derived classes).  



- **Protected Members:** Behave like private members **inside the class** but can be accessed in derived classes.  



- **Public Members:** Can be accessed from anywhere.  







### **Why Use Protected Members?**  



Protected members are useful when you want to allow **child classes** to inherit and modify a member but keep it hidden from direct access outside the class.  







For example, suppose we are designing a **student database system** in CodingGita's BTech program. We don’t want students to access their **internal scores directly**, but faculty should be able to modify them.  







### **Example: Access Control Using Protected Members**  







```cpp



#include <iostream>



using namespace std;







class Student {



protected:  // Protected member



    int marks;







public:



    void setMarks(int m) {



        marks = m;



    }



};







class Topper : public Student {



public:



    void showMarks() {



        cout << "Marks: " << marks << endl; // Allowed since marks is protected



    }



};







int main() {



    Topper obj;



    obj.setMarks(95);



    obj.showMarks();







    // obj.marks = 100;  //  Error! Can't access protected members directly



    return 0;



}



```







### **Output:**  



```



Marks: 95



```



**Explanation:**  



- The `marks` variable is **protected**, so it **cannot be accessed directly** in `main()`.  



- However, the **derived class `Topper` can access `marks`** inside its method `showMarks()`.  







---







## **Inheritance and Protected Access Modifiers**  



### **How Different Inheritance Modes Affect Protected Members?**  



The behavior of **protected** members changes based on how the class is inherited:  







| Inheritance Mode | Protected Members Become |



|------------------|------------------------|



| **Public Inheritance** | **Protected** in derived class |



| **Protected Inheritance** | **Protected** in derived class |



| **Private Inheritance** | **Private** in derived class |







### **Example: How Inheritance Modes Affect Protected Members**  



```cpp



#include <iostream>



using namespace std;







class Base {



protected:



    int value = 10;



};







// Public Inheritance



class PublicDerived : public Base {



public:



    void showValue() {



        cout << "Public Inheritance: " << value << endl;  // Accessible



    }



};







// Protected Inheritance



class ProtectedDerived : protected Base {



public:



    void showValue() {



        cout << "Protected Inheritance: " << value << endl;  // Accessible



    }



};







// Private Inheritance



class PrivateDerived : private Base {



public:



    void showValue() {



        cout << "Private Inheritance: " << value << endl;  // Accessible



    }



};







int main() {



    PublicDerived pubObj;



    pubObj.showValue();



    // pubObj.value = 20; //  Error: Still protected, cannot access directly







    ProtectedDerived protObj;



    protObj.showValue();



    // protObj.value = 20; // Error: Cannot access







    PrivateDerived privObj;



    privObj.showValue();



    // privObj.value = 20; // Error: Cannot access







    return 0;



}



```



### **Output:**



```



Public Inheritance: 10



Protected Inheritance: 10



Private Inheritance: 10



```







**Key Observations:**  



- **Public Inheritance:** The protected member remains **protected** in the derived class but accessible inside it.  



- **Protected Inheritance:** The protected member **remains protected** in the derived class, and access is only available inside derived classes.  



- **Private Inheritance:** The protected member **becomes private** in the derived class and is **not accessible** in further derived classes.  







---







## **Using Protected Members in a Real-World Scenario**  



Let’s say CodingGita is building a **university system** where **faculty can modify student data, but students should not modify their own data**.  







```cpp



#include <iostream>



using namespace std;







// Base Class: Student



class Student {



protected:



    string name;



    int rollNo;



    int marks;







public:



    Student(string n, int r, int m) : name(n), rollNo(r), marks(m) {}







    void displayInfo() {



        cout << "Name: " << name << ", Roll No: " << rollNo << endl;



    }



};







// Derived Class: Faculty (can modify marks)



class Faculty : public Student {



public:



    Faculty(string n, int r, int m) : Student(n, r, m) {}







    void updateMarks(int newMarks) {



        marks = newMarks;



        cout << "Marks updated to: " << marks << endl;



    }



};







// Derived Class: StudentAccess (cannot modify marks)



class StudentAccess : public Student {



public:



    StudentAccess(string n, int r, int m) : Student(n, r, m) {}







    void viewMarks() {



        cout << "Marks: " << marks << endl;  // Allowed because marks is protected



    }



};







int main() {



    Faculty faculty("Dr. Mahir", 101, 80);



    faculty.displayInfo();



    faculty.updateMarks(95);







    StudentAccess student("Jenil", 102, 85);



    student.displayInfo();



    student.viewMarks();



    // student.marks = 100;  //  Error: Cannot modify protected member directly







    return 0;



}



```







### **Output:**



```



Name: Dr. Mahir, Roll No: 101



Marks updated to: 95



Name: Jenil, Roll No: 102



Marks: 85



```







**Key Takeaways:**  



- **Faculty (Teacher) can modify marks** because they have special permissions.  



- **Student can only view marks** and not change them.  



- The `marks` variable is **protected**, meaning it is **hidden from direct access** but available inside derived classes.  







---







## **Advantages of Using Protected Members in Inheritance**  



**Encapsulation:** Keeps data secure while allowing controlled access.  



**Code Reusability:** Derived classes can use and modify protected members without rewriting the base class.  



**Hierarchical Access Control:** Different user roles (like student and faculty) can have **different access permissions**.  



**Prevents Accidental Modification:** Protected members are **hidden from direct modification**, reducing errors in complex programs.  







---







## **Conclusion**  



Protected members **bridge the gap between private and public access** by allowing **inheritance-based access control**. They are crucial in **real-world applications** where different users (like students and faculty) need **different access levels**. Understanding how different inheritance modes affect protected members **ensures better security and modular programming** in C++.  























# **Constructor and Destructor Behavior in Inheritance**  







## **Introduction**



In C++, constructors and destructors play a crucial role in initializing and cleaning up objects. When **inheritance** is involved, their behavior follows a specific order to ensure that both the **base class** and **derived class** are properly initialized and destroyed.  







This article explores:  



1. **How constructors work in inheritance**  



2. **How destructors behave in inheritance**  



3. **Order of execution**  



4. **Explicit constructor calls in derived classes**  



5. **Virtual destructors** and their significance  







---







## **1. Constructor Behavior in Inheritance**



A **constructor** is a special member function that initializes an object when it is created.  







### **Key Rules of Constructor Execution in Inheritance**



1. **Base class constructor executes first** before the derived class constructor.  



2. If a derived class does not explicitly call the base class constructor, the **default constructor** of the base class is called automatically.  



3. If the base class has **parameterized constructors**, the derived class must explicitly call them.  







### **Example: Constructor Execution in Inheritance**



```cpp



#include <iostream>



using namespace std;







class Base {



public:



    Base() { cout << "Base Class Constructor Called" << endl; }



};







class Derived : public Base {



public:



    Derived() { cout << "Derived Class Constructor Called" << endl; }



};







int main() {



    Derived obj;



    return 0;



}



```



**Output:**



```



Base Class Constructor Called



Derived Class Constructor Called



```



**Explanation:**



- When `Derived obj;` is created, first the **Base** class constructor executes.



- Then, the **Derived** class constructor executes.  







This ensures that the base class is always initialized before the derived class.







---







## **2. Constructor with Parameters in Inheritance**



If the **base class has parameterized constructors**, the derived class must explicitly invoke them.







### **Example: Calling a Parameterized Constructor of the Base Class**



```cpp



#include <iostream>



using namespace std;







class Base {



public:



    Base(int x) { 



        cout << "Base Class Constructor Called with value: " << x << endl; 



    }



};







class Derived : public Base {



public:



    Derived(int y) : Base(y) { // Explicitly calling Base constructor



        cout << "Derived Class Constructor Called" << endl;



    }



};







int main() {



    Derived obj(10);



    return 0;



}



```



**Output:**



```



Base Class Constructor Called with value: 10



Derived Class Constructor Called



```



**Explanation:**



- The **Derived class constructor** explicitly calls the base class constructor using `Base(y)`.  



- This ensures the base class constructor is properly initialized with the required arguments.  







---







## **3. Destructor Behavior in Inheritance**



A **destructor** is a special member function that is executed when an object is destroyed.  







### **Key Rules of Destructor Execution in Inheritance**



1. **Derived class destructor executes first**, then the base class destructor.  



2. This ensures proper cleanup, as derived class members might depend on the base class.  







### **Example: Destructor Execution Order**



```cpp



#include <iostream>



using namespace std;







class Base {



public:



    Base() { cout << "Base Constructor Called" << endl; }



    ~Base() { cout << "Base Destructor Called" << endl; }



};







class Derived : public Base {



public:



    Derived() { cout << "Derived Constructor Called" << endl; }



    ~Derived() { cout << "Derived Destructor Called" << endl; }



};







int main() {



    Derived obj;



    return 0;



}



```



**Output:**



```



Base Constructor Called



Derived Constructor Called



Derived Destructor Called



Base Destructor Called



```



**Explanation:**



- Constructors execute **from base to derived** (`Base → Derived`).  



- Destructors execute **from derived to base** (`Derived → Base`).  







This ensures that the **derived class cleans up its own resources first**, before the base class is destroyed.







---







## **4. Explicitly Calling Base Class Constructor in Derived Class**



By default, the **default constructor** of the base class is invoked if no explicit constructor is provided in the derived class.  







However, if the base class has **multiple constructors**, we need to explicitly call the correct one.







### **Example: Using Different Base Class Constructors**



```cpp



#include <iostream>



using namespace std;







class Base {



public:



    Base() { cout << "Default Base Constructor" << endl; }



    Base(int x) { cout << "Parameterized Base Constructor: " << x << endl; }



};







class Derived : public Base {



public:



    Derived(int y) : Base(y) { // Explicitly calling parameterized constructor



        cout << "Derived Constructor Called" << endl;



    }



};







int main() {



    Derived obj(42);



    return 0;



}



```



**Output:**



```



Parameterized Base Constructor: 42



Derived Constructor Called



```



**Explanation:**



- The derived class constructor `Derived(int y)` explicitly calls `Base(y)`, ensuring the correct base class constructor is invoked.







---







## **5. Virtual Destructors and Why They Matter**



If a base class has a **virtual destructor**, it ensures that the correct destructor sequence is followed, even when deleting objects via base class pointers.







### **Why Use Virtual Destructors?**



1. Prevents **memory leaks** when dealing with polymorphism.  



2. Ensures that both **base and derived destructors** execute properly.  







### **Example: Virtual Destructor Ensuring Proper Cleanup**



```cpp



#include <iostream>



using namespace std;







class Base {



public:



    Base() { cout << "Base Constructor" << endl; }



    virtual ~Base() { cout << "Base Destructor" << endl; } // Virtual Destructor



};







class Derived : public Base {



public:



    Derived() { cout << "Derived Constructor" << endl; }



    ~Derived() { cout << "Derived Destructor" << endl; }



};







int main() {



    Base* obj = new Derived(); // Creating Derived object using Base pointer



    delete obj; // Proper destruction due to virtual destructor



    return 0;



}



```



**Output:**



```



Base Constructor



Derived Constructor



Derived Destructor



Base Destructor



```



**Without a virtual destructor, the output would be:**



```



Base Constructor



Derived Constructor



Base Destructor



```



- The **Derived destructor is skipped**, causing a memory leak.  



- Using a **virtual destructor** ensures the correct order of destruction.  







---







## **6. Key Takeaways**



| **Concept** | **Behavior** |



|------------|-------------|



| **Constructor Execution Order** | Base class constructor → Derived class constructor |



| **Destructor Execution Order** | Derived class destructor → Base class destructor |



| **Parameterized Constructors** | Derived class must explicitly call them using `Base(arguments)` |



| **Virtual Destructor** | Ensures proper cleanup in polymorphism |



| **Implicit Base Constructor Call** | If not explicitly called, the default constructor is used |







---







## **Conclusion**



- **Constructors in inheritance** always execute **from base to derived** to ensure proper initialization.



- **Destructors execute in reverse order** to safely deallocate resources before the base class is destroyed.



- If a base class has **parameterized constructors**, the derived class **must explicitly call** them.



- **Virtual destructors** are crucial in polymorphism to prevent memory leaks.















# **Virtual Functions and Pure Virtual Functions in C++**  







In C++, **virtual functions** and **pure virtual functions** are key concepts in achieving **dynamic polymorphism**. They allow for flexibility and extensibility in object-oriented programming by enabling **runtime method overriding**.  







This article explores:  



- What virtual functions are  



- How they enable runtime polymorphism  



- The concept of pure virtual functions  



- The role of abstract classes  



- How the virtual table (vtable) and virtual pointer (vptr) work  







---







## **1. Virtual Functions in C++**  







### **A. What is a Virtual Function?**  



A **virtual function** is a member function in a base class that can be **overridden in a derived class**. It allows function calls to be **resolved at runtime** instead of compile time, enabling **dynamic polymorphism**.  







A function is declared **virtual** using the `virtual` keyword in the base class.  







### **B. Example of Virtual Function**



```cpp



#include <iostream>



using namespace std;







class Base {



public:



    virtual void show() {  // Virtual function



        cout << "Base class show function" << endl;



    }



};







class Derived : public Base {



public:



    void show() override {  // Overriding virtual function



        cout << "Derived class show function" << endl;



    }



};







int main() {



    Base* bptr;  // Base class pointer



    Derived d;



    



    bptr = &d;  // Base class pointer points to derived class object



    bptr->show();  // Calls Derived class function at runtime







    return 0;



}



```



### **Output:**



```



Derived class show function



```



**Explanation:**  



- The `show()` function in `Base` is marked as `virtual`, so when a **base class pointer** points to a `Derived` object, the overridden `show()` in `Derived` executes.  



- Without `virtual`, the base class function would execute instead (static binding).  







---







### **C. Rules for Virtual Functions**  



1. Virtual functions **must be declared in the base class**.  



2. They **must be overridden** in the derived class to provide specific behavior.  



3. **Function calls are resolved at runtime** (dynamic binding).  



4. A **base class pointer** or reference should be used to invoke them.  



5. **Constructors cannot be virtual**, but **destructors should be virtual** to ensure proper cleanup in derived classes.  







---







## **2. Pure Virtual Functions and Abstract Classes**  







### **A. What is a Pure Virtual Function?**  



A **pure virtual function** is a virtual function that has **no implementation** in the base class and **must** be overridden in derived classes. It is declared using `= 0`.  







A class containing at least **one pure virtual function** is called an **abstract class** and **cannot be instantiated**.







### **B. Example of Pure Virtual Function**



```cpp



#include <iostream>



using namespace std;







// Abstract base class



class Shape {



public:



    virtual void draw() = 0;  // Pure virtual function



};







// Derived class overriding pure virtual function



class Circle : public Shape {



public:



    void draw() override {



        cout << "Drawing Circle" << endl;



    }



};







class Rectangle : public Shape {



public:



    void draw() override {



        cout << "Drawing Rectangle" << endl;



    }



};







int main() {



    Shape* s1 = new Circle();   // Base class pointer to derived object



    Shape* s2 = new Rectangle();



    



    s1->draw();  // Calls Circle's draw()



    s2->draw();  // Calls Rectangle's draw()



    



    delete s1;



    delete s2;







    return 0;



}



```



### **Output:**



```



Drawing Circle



Drawing Rectangle



```



**Explanation:**  



- The `Shape` class has a pure virtual function `draw()`, making it an **abstract class**.  



- Any class inheriting from `Shape` **must override `draw()`**, or it will also be an abstract class.  



- The base class pointer (`Shape*`) is used to call the overridden functions dynamically.  







---







### **C. Properties of Pure Virtual Functions**



1. A **pure virtual function is declared as `= 0`** in the base class.  



2. Any class containing at least **one pure virtual function becomes an abstract class**.  



3. **Abstract classes cannot be instantiated**.  



4. **Derived classes must override the pure virtual function**, otherwise, they also become abstract.  



5. **Dynamic polymorphism is achieved using base class pointers or references**.  







---







## **3. Virtual Table (VTable) and Virtual Pointer (VPTR)**



### **A. How Does the Virtual Function Mechanism Work Internally?**  







In C++, when a class has **at least one virtual function**, the compiler creates:  







1. **Virtual Table (vtable)**:  



   - A lookup table containing function pointers for virtual functions.  



   - Each class with virtual functions has its own vtable.  



   



2. **Virtual Pointer (vptr)**:  



   - Each object of a class with virtual functions has a **hidden pointer** (`vptr`) to the **vtable** of its class.  







---







### **B. Understanding vtable and vptr with an Example**



```cpp



#include <iostream>



using namespace std;







class Base {



public:



    virtual void show() { cout << "Base class show function" << endl; }



};







class Derived : public Base {



public:



    void show() override { cout << "Derived class show function" << endl; }



};







int main() {



    Base* bptr;  



    Derived d;



    bptr = &d;



    bptr->show();  // Calls Derived's function using vtable







    return 0;



}



```



### **How the Compiler Handles This:**



- **Base Class vtable**  



  ```



  vtable_Base:



  [0] → Base::show()



  ```







- **Derived Class vtable**  



  ```



  vtable_Derived:



  [0] → Derived::show()



  ```







- **Memory Layout:**



  ```



  Derived Object:



  ┌─────────────┐



  │ vptr → vtable_Derived │



  ├─────────────┤



  │ Data Members │



  ├─────────────┤



  │ Functions   │



  └─────────────┘



  ```



  - The `vptr` of `Derived` class object points to `vtable_Derived`, which ensures **runtime resolution of function calls**.  







---







## **4. Virtual Destructor in C++**



A **virtual destructor** ensures proper cleanup of derived class objects when deleted through a base class pointer.







### **Example of Virtual Destructor**



```cpp



#include <iostream>



using namespace std;







class Base {



public:



    Base() { cout << "Base Constructor\n"; }



    virtual ~Base() { cout << "Base Destructor\n"; }  // Virtual destructor



};







class Derived : public Base {



public:



    Derived() { cout << "Derived Constructor\n"; }



    ~Derived() { cout << "Derived Destructor\n"; }



};







int main() {



    Base* bptr = new Derived();



    delete bptr;  // Ensures Derived's destructor is called



    return 0;



}



```



### **Output:**



```



Base Constructor



Derived Constructor



Derived Destructor



Base Destructor



```



Without a **virtual destructor**, the **Derived destructor wouldn’t be called**, causing a memory leak.







---







## **5. Key Differences: Virtual vs. Pure Virtual Functions**



| Feature                 | Virtual Function | Pure Virtual Function |



|------------------------|----------------|---------------------|



| Has Implementation?   | Yes (in base class) | No (declared as `= 0`) |



| Needs to be Overridden? | No (optional) | Yes (mandatory) |



| Can Instantiate Base Class? | Yes | No (abstract class) |







---







## **Conclusion**



- **Virtual functions** enable **runtime polymorphism** by allowing function overriding in derived classes.  



- **Pure virtual functions** make a class **abstract**, forcing derived classes to implement them.  



- **Vtable and vptr** manage function resolution dynamically.  



- **Virtual destructors** ensure proper cleanup of derived objects.  















# **Dynamic Polymorphism Using Virtual Tables in C++**  







## **Introduction**  



**Dynamic polymorphism** is a fundamental concept in object-oriented programming that allows **function overriding** to be resolved at **runtime**. In C++, this is achieved using **virtual functions**, which are implemented internally using a **virtual table (vtable) and a virtual pointer (vptr)**.  







This article explains:  



- What dynamic polymorphism is  



- How virtual functions enable dynamic binding  



- The role of vtable and vptr  



- How function calls are resolved at runtime  



- Memory layout of objects with virtual functions  







---







## **1. Understanding Dynamic Polymorphism**  







### **A. What is Polymorphism?**  



Polymorphism allows **the same function call** to behave differently based on the **object type**.  







There are two types of polymorphism:  



1. **Compile-time (Static) Polymorphism** → Achieved using **function overloading** and **operator overloading**  



2. **Runtime (Dynamic) Polymorphism** → Achieved using **virtual functions**  







### **B. How Dynamic Polymorphism Works?**  



- In **static binding**, the function to be called is decided at **compile-time**.  



- In **dynamic binding**, the function to be called is determined at **runtime** based on the **actual object type**.  



- **Virtual functions enable dynamic binding**, allowing derived class methods to be invoked through a base class pointer.  







---







## **2. Role of Virtual Functions in Dynamic Polymorphism**  







### **A. Example Without Virtual Functions (Static Binding)**



```cpp



#include <iostream>



using namespace std;







class Base {



public:



    void show() {  // Non-virtual function



        cout << "Base class show function" << endl;



    }



};







class Derived : public Base {



public:



    void show() {  // Function overriding



        cout << "Derived class show function" << endl;



    }



};







int main() {



    Base* bptr;  



    Derived d;



    bptr = &d;  



    bptr->show();  // Calls Base class function (static binding)







    return 0;



}



```



### **Output:**



```



Base class show function



```



**Explanation:**  



- `bptr` is a **base class pointer** pointing to a `Derived` object.  



- Since `show()` is **not virtual**, function calls are resolved **at compile-time** based on the **pointer type** (`Base*`).  







---







### **B. Example With Virtual Functions (Dynamic Binding)**



```cpp



#include <iostream>



using namespace std;







class Base {



public:



    virtual void show() {  // Virtual function



        cout << "Base class show function" << endl;



    }



};







class Derived : public Base {



public:



    void show() override {  // Overriding virtual function



        cout << "Derived class show function" << endl;



    }



};







int main() {



    Base* bptr;  



    Derived d;



    bptr = &d;  



    bptr->show();  // Calls Derived class function (dynamic binding)







    return 0;



}



```



### **Output:**



```



Derived class show function



```



**Explanation:**  



- Since `show()` is **virtual**, C++ uses **dynamic binding**.  



- The function is resolved at **runtime** based on the actual object type (`Derived`).  



- Internally, this is managed using a **vtable and vptr**.  







---







## **3. Virtual Table (vtable) and Virtual Pointer (vptr)**  







### **A. What is vtable?**  



A **virtual table (vtable)** is a hidden **lookup table** maintained by the compiler for each **class containing virtual functions**. It stores **pointers to virtual functions**.  







### **B. What is vptr?**  



A **virtual pointer (vptr)** is a hidden pointer in **each object** of a class that contains virtual functions. It **points to the vtable** of the corresponding class.  







---







## **4. How vtable and vptr Work Internally?**  







Consider the following code:



```cpp



#include <iostream>



using namespace std;







class Base {



public:



    virtual void show() { cout << "Base class show function" << endl; }



};







class Derived : public Base {



public:



    void show() override { cout << "Derived class show function" << endl; }



};







int main() {



    Base* bptr;



    Derived d;



    bptr = &d;



    bptr->show();  // Resolved using vtable







    return 0;



}



```







### **A. vtable Structure Created by Compiler**  



#### **Base Class vtable**



```



vtable_Base:



[0] → Base::show()



```







#### **Derived Class vtable**



```



vtable_Derived:



[0] → Derived::show()



```







---







### **B. Memory Layout of an Object with vptr**  



Each object of a class with virtual functions has a **hidden `vptr`**, which points to the **vtable**.  







#### **Memory Representation of a Derived Object**



```



Derived Object:



┌─────────────┐



│ vptr → vtable_Derived │



├─────────────┤



│ Data Members │



├─────────────┤



│ Functions   │



└─────────────┘



```



- When `bptr->show()` is called, the **vptr** in `Derived` object points to `vtable_Derived`, which calls `Derived::show()`.  



- This ensures that the correct function is called **at runtime**.  







---







## **5. Understanding Virtual Function Calls at Runtime**  







### **A. Steps of Function Call Resolution**



1. **Base class pointer (`bptr`) points to Derived class object (`d`).**  



2. **C++ fetches `vptr` from the `Derived` object.**  



3. **The `vptr` points to `vtable_Derived`.**  



4. **The function call is resolved dynamically by looking up `show()` in `vtable_Derived`.**  







### **B. Function Call Flow (Diagram)**



```



bptr->show()



   ↓



Fetch vptr from object



   ↓



vptr points to vtable_Derived



   ↓



Call Derived::show()



```







---







## **6. Virtual Destructors and Cleanup**  







If a **base class destructor is not virtual**, deleting a derived object through a base class pointer **causes memory leaks**.







### **Example Without Virtual Destructor (Memory Leak)**



```cpp



#include <iostream>



using namespace std;







class Base {



public:



    Base() { cout << "Base Constructor\n"; }



    ~Base() { cout << "Base Destructor\n"; }  // Not virtual



};







class Derived : public Base {



public:



    Derived() { cout << "Derived Constructor\n"; }



    ~Derived() { cout << "Derived Destructor\n"; }



};







int main() {



    Base* bptr = new Derived();



    delete bptr;  // Only Base destructor is called (memory leak)



    return 0;



}



```



### **Output:**



```



Base Constructor



Derived Constructor



Base Destructor  // Derived Destructor is never called!



```







---







### **Solution: Use a Virtual Destructor**



```cpp



class Base {



public:



    virtual ~Base() { cout << "Base Destructor\n"; }



};



```



Now, `Derived`'s destructor is properly called, avoiding memory leaks.







---







## **7. Key Takeaways**



| Feature                 | Without Virtual Table | With Virtual Table |



|------------------------|------------------|------------------|



| Function Call Type     | Static Binding (Compile-time) | Dynamic Binding (Runtime) |



| Uses Function Pointers? | No | Yes (via vtable) |



| Base Class Pointer Calls | Base class function | Derived class function |



| Memory Overhead? | None | Small (vptr + vtable) |







---







## **Conclusion**  



- **Dynamic polymorphism** enables **runtime method overriding** using **virtual functions**.  



- **Vtable and vptr** handle dynamic function resolution in C++.  



- **Virtual destructors** prevent memory leaks.  



- Understanding **how virtual tables work internally** helps optimize performance and avoid common pitfalls in **object-oriented programming**.























# **Friend Functions and Friend Classes in C++**







In C++, **friend functions** and **friend classes** allow external functions or classes to access the private and protected members of another class. These concepts are useful when we need to provide controlled access to class internals while still maintaining encapsulation.







---







## **1. Friend Functions in C++**







### **A. What is a Friend Function?**



A **friend function** is a function that is **not a member of a class** but has permission to access its **private and protected members**. This is achieved by declaring the function as a `friend` inside the class.







Unlike member functions, friend functions:



- Do not require an object to be invoked.



- Are defined outside the class.



- Can access private and protected members of the class.







### **B. Syntax of Friend Function**



To declare a friend function inside a class, we use the `friend` keyword.







```cpp



class ClassName {



    friend ReturnType FunctionName(Parameters);



};



```



The function itself is defined outside the class like a normal function.







### **C. Example of Friend Function**



```cpp



#include <iostream>



using namespace std;







class Box {



private:



    int width;







public:



    Box(int w) : width(w) {}







    // Friend function declaration



    friend void printWidth(Box b);



};







// Friend function definition



void printWidth(Box b) {



    cout << "Width: " << b.width << endl;



}







int main() {



    Box box(10);



    printWidth(box);  // Friend function accessing private member



    return 0;



}



```



**Output:**



```



Width: 10



```



In this example, `printWidth()` is a **non-member** function but can access `width`, which is private inside `Box`.







---







## **2. Usage and Benefits of Friend Functions**



### **A. Why Use Friend Functions?**



1. **Access Control Without Inheritance:**  



   - Normally, only member functions of a class can access private/protected members.  



   - A friend function **bypasses** this restriction without needing inheritance.  







2. **Useful for Operator Overloading:**  



   - Overloading operators like `<<` (insertion operator for `cout`) requires non-member functions, which can be friend functions.







3. **Working with Multiple Classes:**  



   - When two classes need to **share private data**, a friend function can act as a bridge.







### **B. Example: Friend Function with Multiple Classes**



```cpp



#include <iostream>



using namespace std;







class ClassB; // Forward declaration







class ClassA {



private:



    int numA;







public:



    ClassA(int x) : numA(x) {}







    // Declare friend function



    friend void add(ClassA, ClassB);



};







class ClassB {



private:



    int numB;







public:



    ClassB(int y) : numB(y) {}







    // Declare friend function



    friend void add(ClassA, ClassB);



};







// Friend function definition



void add(ClassA objA, ClassB objB) {



    cout << "Sum: " << objA.numA + objB.numB << endl;



}







int main() {



    ClassA objA(5);



    ClassB objB(7);



    add(objA, objB); // Friend function accessing private members of both classes



    return 0;



}



```



**Output:**



```



Sum: 12



```



Here, `add()` is a **friend function** of both `ClassA` and `ClassB`, allowing it to access private members of both classes.







---







## **3. Friend Classes in C++**







### **A. What is a Friend Class?**



A **friend class** is a class that is **granted access** to another class’s **private and protected members**. This is useful when **two classes need to work closely together**.







### **B. Syntax of Friend Class**



To declare a friend class inside another class, use the `friend` keyword.







```cpp



class ClassB; // Forward declaration







class ClassA {



    friend class ClassB; // ClassB is a friend of ClassA



};



```







### **C. Example of Friend Class**



```cpp



#include <iostream>



using namespace std;







class Engine {



private:



    int horsepower;







public:



    Engine(int hp) : horsepower(hp) {}







    // Declaring Car as a friend class



    friend class Car;



};







class Car {



public:



    void showEnginePower(Engine e) {



        cout << "Car Engine Power: " << e.horsepower << " HP" << endl;



    }



};







int main() {



    Engine engine(150);



    Car car;



    car.showEnginePower(engine); // Friend class accessing private member



    return 0;



}



```



**Output:**



```



Car Engine Power: 150 HP



```



Here, `Car` is a **friend class** of `Engine`, allowing it to access `horsepower`, which is private in `Engine`.







---







## **4. Friend Function vs. Friend Class**



| Feature | Friend Function | Friend Class |



|---------|---------------|-------------|



| Access | Can access private/protected members | All members of friend class can access private/protected members |



| Declaration | Declared inside the class | Declared inside the class |



| Scope | Can be a single function | Applies to an entire class |



| Use Case | Useful for operator overloading and accessing private members | Useful when two classes need deep cooperation |







---







## **5. Real-World Applications of Friend Functions and Classes**



- **Operator Overloading** (e.g., `<<` and `>>` operators).



- **Encapsulation with Controlled Access** (sharing private data across classes).



- **Hardware Simulations** (e.g., `Car` and `Engine` example).



- **Game Development** (e.g., granting `Player` class access to `Weapon` class internals).







---







## **Conclusion**



Friend functions and friend classes in C++ allow controlled access to private members while maintaining encapsulation. **Friend functions** are useful when external functions need access to class members, while **friend classes** allow an entire class to interact with another class’s private members. These features help in designing more flexible and maintainable object-oriented programs















## **Function and Class Templates in C++**  







### **Introduction to Templates**  



Templates in C++ allow us to write **generic** code that can work with multiple data types. Instead of writing separate functions or classes for each data type, we can create **templates** that adapt based on the type of data passed to them.  







Templates improve **code reusability, maintainability, and efficiency**, especially in scenarios where we need to perform similar operations on different data types.  







---







## **1. Function Templates**  



A **function template** allows us to create a function that works with any data type. Instead of defining multiple functions for different types, we write one **generic function**.  







### **Syntax of a Function Template**



```cpp



template <typename T>



T functionName(T parameter) {



    // Function definition



}



```



- `template <typename T>` tells the compiler that `T` is a **placeholder** for a data type.  



- `T parameter` is a **generic parameter** that will be replaced with a specific type when the function is called.  







### **Example: Function Template for Finding Maximum**  



```cpp



#include <iostream>



using namespace std;







// Function template to find the maximum of two numbers



template <typename T>



T findMax(T a, T b) {



    return (a > b) ? a : b;



}







int main() {



    cout << "Max of 10 and 20: " << findMax(10, 20) << endl;



    cout << "Max of 5.5 and 2.2: " << findMax(5.5, 2.2) << endl;



    cout << "Max of 'A' and 'Z': " << findMax('A', 'Z') << endl;



    return 0;



}



```



### **Output**



```



Max of 10 and 20: 20



Max of 5.5 and 2.2: 5.5



Max of 'A' and 'Z': Z



```



Here, `findMax()` is a **single function** that works for `int`, `double`, and `char` because it is a template function.  







---







### **Function Templates with Multiple Parameters**



We can use multiple template parameters by specifying multiple **placeholder types**.  







#### **Example: Function Template with Two Different Types**  



```cpp



#include <iostream>



using namespace std;







// Function template with two different types



template <typename T1, typename T2>



void printData(T1 a, T2 b) {



    cout << "First: " << a << ", Second: " << b << endl;



}







int main() {



    printData(10, 3.14);      // int and double



    printData("Hello", 42);   // string and int



    return 0;



}



```



### **Output**



```



First: 10, Second: 3.14



First: Hello, Second: 42



```



This template function allows different types of arguments to be passed without needing multiple function definitions.







---







## **2. Class Templates**  



A **class template** is a blueprint for creating classes that can work with different data types. Instead of writing separate classes for `int`, `float`, `string`, etc., we define a **generic class** using templates.







### **Syntax of a Class Template**



```cpp



template <typename T>



class ClassName {



    T data;



public:



    ClassName(T value) { data = value; }



    void display() { cout << "Data: " << data << endl; }



};



```



- `T` is a **placeholder** for a data type.  



- The actual type of `T` is **determined when an object is created**.  







### **Example: Creating a Generic Class**



```cpp



#include <iostream>



using namespace std;







// Class template



template <typename T>



class Box {



    T value;



public:



    Box(T v) { value = v; }



    void show() { cout << "Value: " << value << endl; }



};







int main() {



    Box<int> intBox(100);



    Box<double> doubleBox(10.5);



    Box<string> stringBox("Hello");







    intBox.show();



    doubleBox.show();



    stringBox.show();



    



    return 0;



}



```



### **Output**



```



Value: 100



Value: 10.5



Value: Hello



```



Here, we used **one class template** to handle different data types (`int`, `double`, and `string`).  







---







### **Class Template with Multiple Parameters**



Like function templates, class templates can have **multiple template parameters**.







#### **Example: Class Template with Two Different Data Types**



```cpp



#include <iostream>



using namespace std;







// Class template with two types



template <typename T1, typename T2>



class Pair {



    T1 first;



    T2 second;



public:



    Pair(T1 a, T2 b) : first(a), second(b) {}



    void display() {



        cout << "First: " << first << ", Second: " << second << endl;



    }



};







int main() {



    Pair<int, double> p1(10, 3.14);



    Pair<string, char> p2("Hello", 'A');







    p1.display();



    p2.display();







    return 0;



}



```



### **Output**



```



First: 10, Second: 3.14



First: Hello, Second: A



```



This allows **flexibility** when working with different data types in the same class.







---







## **Advantages of Templates in C++**



1. **Code Reusability** – Avoids redundant code for similar functions/classes with different data types.  



2. **Type Safety** – Ensures operations are performed on the correct data types at compile-time.  



3. **Flexibility** – Works with both primitive and user-defined data types.  



4. **Efficiency** – Reduces unnecessary function/class duplication, making the program concise and optimized.  







---







## **Conclusion**



Function and class templates make C++ **more powerful and flexible** by allowing generic programming.  



- **Function templates** enable writing functions that work with any data type.  



- **Class templates** help in defining generic classes that can store and process different data types.

## **Template Specialization in C++**  







### **Introduction to Template Specialization**  



Template specialization is an **advanced feature** of C++ templates that allows us to define a custom implementation of a template for a **specific data type**.  







This is useful when a **generic implementation** of a function or class **does not work optimally** for a particular data type. Instead of modifying the entire template, we can create a **specialized version** for that data type.  







---







## **1. Function Template Specialization**  



In function template specialization, we define a **regular template** and then provide a **specific implementation** for a particular data type.  







### **Example: Specializing a Function for `char*` Strings**  



```cpp



#include <iostream>



using namespace std;







// Generic function template



template <typename T>



void showData(T data) {



    cout << "Generic: " << data << endl;



}







// Specialized function for char* (C-style strings)



template <>



void showData<char*>(char* data) {



    cout << "Specialized for char*: " << data << endl;



}







int main() {



    showData(10);          // Calls generic function



    showData(3.14);        // Calls generic function



    showData("Hello");     // Calls specialized function for char*







    return 0;



}



```



### **Output**



```



Generic: 10



Generic: 3.14



Specialized for char*: Hello



```



- The generic function is called for **int** and **double**.



- The specialized function is called for **char*** (C-style strings).  







---







## **2. Class Template Specialization**  



Class template specialization allows us to create a **customized version** of a class template for a **specific type**.

    T value;



public:

};

template <>



class Box<bool> {

public:

Value: 10.5



Boolean Value: True

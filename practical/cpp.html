---







### **B. What is an Object?**







An **object** is an instance of a class. It represents a real-world entity and contains specific values for the properties defined in the class.







#### **Key Features of Objects:**







- Each object has a unique identity.



- Objects hold their own data and behaviors defined by the class.







#### **Multiple Objects Example:**







```cpp



Car car1, car2;



car1.brand = "Honda";



car1.year = 2021;



car2.brand = "Ford";



car2.year = 2023;



car1.display();



car2.display();



```







Each object (`car1`, `car2`) has its own data while using the same class structure.







---







## **2. Abstraction in OOP**







### **A. What is Abstraction?**







Abstraction is the process of **hiding implementation details** and exposing only the essential features of an object. It simplifies complex systems by focusing on relevant details.







#### **Example of Abstraction:**







```cpp



#include <iostream>



using namespace std;







class BankAccount {



private:



    double balance;  // Hidden data (implementation detail)







public:



    // Constructor



    BankAccount(double initialBalance) {



        balance = initialBalance;



    }







    // Public method to deposit money



    void deposit(double amount) {



        balance += amount;



        cout << "Deposited: " << amount << endl;



    }







    // Public method to display balance



    void showBalance() {



        cout << "Balance: " << balance << endl;



    }



};







int main() {



    BankAccount myAccount(1000); // Creating object with initial balance



    myAccount.deposit(500);



    myAccount.showBalance();



    return 0;



}



```







**Output:**







```



Deposited: 500



Balance: 1500



```







Here, the `balance` variable is private, ensuring that users of `BankAccount` class cannot modify it directly. Instead, they use the `deposit()` and `showBalance()` methods, hiding unnecessary details.







#### **Advantages of Abstraction:**







- Reduces code complexity.



- Enhances maintainability.



- Prevents direct access to sensitive data.







---







## **3. Encapsulation in OOP**







### **A. What is Encapsulation?**







Encapsulation is the technique of **bundling data (variables) and methods (functions) together** within a class while restricting direct access to some components. It protects data integrity and ensures controlled access.







### **Encapsulation in Action:**







```cpp



#include <iostream>



using namespace std;







class Student {



private:



    string name;



    int age;







public:



    // Setter methods



    void setName(string n) { name = n; }



    void setAge(int a) {



        if(a > 0) age = a;  // Data validation



        else cout << "Invalid age!" << endl;



    }







    // Getter methods



    string getName() { return name; }



    int getAge() { return age; }



};







int main() {



    Student s;



    s.setName("Jenil");



    s.setAge(20);



    cout << "Name: " << s.getName() << ", Age: " << s.getAge() << endl;



    return 0;



}



```







**Output:**







```



Name: Jenil, Age: 20



```







### **Encapsulation Rules:**







- **Use private data members** to restrict direct access.



- **Provide public setter and getter methods** to control data modification.



- **Ensure data integrity** using validation.







#### **Benefits of Encapsulation:**







✅ Protects data from accidental modification.



✅ Improves modularity.



✅ Increases code reusability and security.







---







## **Conclusion**







Understanding **Objects and Classes**, **Abstraction**, and **Encapsulation** is essential in OOP. These concepts allow programmers to write **efficient, secure, and maintainable** code.







# Inheritance and Polymorphism in C++







Inheritance and Polymorphism are two fundamental concepts in Object-Oriented Programming (OOP). These concepts help in writing reusable, scalable, and maintainable code by establishing relationships between different classes.







---







## **1. Inheritance in C++**



### **A. What is Inheritance?**



Inheritance is a mechanism in C++ that allows a class (child or derived class) to inherit attributes and behaviors from another class (parent or base class). It promotes code reuse and establishes a relationship between classes.







#### **Example:**



```cpp



#include <iostream>



using namespace std;







// Base class



class Vehicle {



public:



    string brand = "Toyota";



    void honk() {



        cout << "Beep! Beep!" << endl;



    }



};







// Derived class inheriting from Vehicle



class Car : public Vehicle {



public:



    string model = "Corolla";



};







int main() {



    Car myCar;



    cout << "Brand: " << myCar.brand << "\n";



    cout << "Model: " << myCar.model << "\n";



    myCar.honk();



    return 0;



}



```



**Output:**



```



Brand: Toyota



Model: Corolla



Beep! Beep!



```



Here, `Car` inherits `brand` and `honk()` from `Vehicle`, demonstrating the basic concept of inheritance.







---







### **B. Types of Inheritance in C++**







1. **Single Inheritance**: One derived class inherits from one base class.



2. **Multiple Inheritance**: A derived class inherits from more than one base class.



3. **Multilevel Inheritance**: A derived class inherits from another derived class.



4. **Hierarchical Inheritance**: Multiple derived classes inherit from a single base class.



5. **Hybrid Inheritance**: A combination of different types of inheritance.







#### **Example of Multiple Inheritance:**



```cpp



class Engine {



public:



    void engineType() {



        cout << "This is a V8 engine." << endl;



    }



};







class Transmission {



public:



    void transmissionType() {



        cout << "Automatic transmission." << endl;



    }



};







class SportsCar : public Engine, public Transmission {



public:



    void carType() {



        cout << "This is a sports car." << endl;



    }



};







int main() {



    SportsCar myCar;



    myCar.carType();



    myCar.engineType();



    myCar.transmissionType();



    return 0;



}



```



**Output:**



```



This is a sports car.



This is a V8 engine.



Automatic transmission.



```



Here, `SportsCar` inherits from both `Engine` and `Transmission`, showcasing multiple inheritance.







---







## **2. Polymorphism in C++**







### **A. What is Polymorphism?**



Polymorphism means "many forms" and allows one interface to be used for different data types. It enables a single function or operator to have multiple implementations.







### **B. Types of Polymorphism in C++**



1. **Compile-time Polymorphism (Static Binding)**: Achieved through function overloading and operator overloading.



2. **Run-time Polymorphism (Dynamic Binding)**: Achieved using function overriding with base and derived classes.







---







### **C. Function Overloading (Compile-Time Polymorphism)**



Function overloading allows multiple functions with the same name but different parameters.







#### **Example:**



```cpp



#include <iostream>



using namespace std;







class Math {



public:



    int add(int a, int b) {



        return a + b;



    }



    double add(double a, double b) {



        return a + b;



    }



};







int main() {



    Math obj;



    cout << "Sum (int): " << obj.add(2, 3) << endl;



    cout << "Sum (double): " << obj.add(2.5, 3.7) << endl;



    return 0;



}



```



**Output:**



```



Sum (int): 5



Sum (double): 6.2



```



Here, the `add()` function is overloaded to work with both integers and doubles.







---







### **D. Operator Overloading (Compile-Time Polymorphism)**



Operator overloading allows user-defined data types to perform operations using built-in operators.







#### **Example:**



```cpp



#include <iostream>



using namespace std;







class Complex {



public:



    int real, imag;



    Complex(int r, int i) : real(r), imag(i) {}







    // Overloading + operator



    Complex operator + (const Complex& obj) {



        return Complex(real + obj.real, imag + obj.imag);



    }







    void display() {



        cout << real << " + " << imag << "i" << endl;



    }



};







int main() {



    Complex c1(3, 4), c2(1, 2);



    Complex c3 = c1 + c2;



    c3.display();



    return 0;



}



```



**Output:**



```



4 + 6i



```



Here, the `+` operator is overloaded to add two `Complex` numbers.







---







### **E. Function Overriding (Run-Time Polymorphism)**



Function overriding allows a derived class to provide a specific implementation of a base class function.







#### **Example:**



```cpp



#include <iostream>



using namespace std;







class Animal {



public:



    virtual void makeSound() {



        cout << "Animal makes a sound" << endl;



    }



};







class Dog : public Animal {



public:



    void makeSound() override {



        cout << "Dog barks" << endl;



    }



};







int main() {



    Animal* a = new Dog();



    a->makeSound();



    delete a;



    return 0;



}



```



**Output:**



```



Dog barks



```



Here, the `makeSound()` function is overridden in the derived `Dog` class, enabling run-time polymorphism.







---







## **Conclusion**



Inheritance and Polymorphism play a crucial role in C++ OOP. Inheritance promotes code reuse by allowing a child class to derive properties from a parent class. Polymorphism enables flexibility by allowing functions and operators to work in multiple ways. These features make C++ a powerful language for building scalable applications.

# **Understanding Access Specifiers in C++**







Access specifiers in C++ play a crucial role in object-oriented programming (OOP). They define the scope and accessibility of class members (attributes and methods). By using access specifiers, you can enforce encapsulation, a fundamental principle of OOP, and control how data is exposed to other parts of the program.







In this article, we will explore the three primary access specifiers in C++:







1. **Public**



2. **Private**



3. **Protected**







---







## **1. What are Access Specifiers?**







Access specifiers define the level of access control for class members in C++. There are three levels:







- **Public:** Members declared as `public` are accessible from anywhere in the program where the object of the class is accessible.



- **Private:** Members declared as `private` are accessible only within the class in which they are declared.



- **Protected:** Members declared as `protected` are accessible within the class and its derived classes.







By default, if no access specifier is provided, class members are treated as **private**.







---







## **2. Public Access Specifier**







When a member of a class is declared as `public`, it can be accessed directly from outside the class using an object of the class.







### **Key Characteristics:**



- Members are accessible anywhere in the program.



- Commonly used for methods that need to interact with other parts of the program.







### **Syntax:**



```cpp



class MyClass {



public:



    int publicVar;







    void displayPublicVar() {



        std::cout << "Public Variable: " << publicVar << std::endl;



    }



};



```







### **Example:**



```cpp



#include <iostream>



using namespace std;







class Car {



public:



    string brand;   // Public member



    void showBrand() {



        cout << "Car brand: " << brand << endl;



    }



};







int main() {



    Car car1;



    car1.brand = "Toyota"; // Accessing public member directly



    car1.showBrand();      // Accessing public member function



    return 0;



}



```







### **Output:**



```



Car brand: Toyota



```







---







## **3. Private Access Specifier**







When a member is declared as `private`, it can only be accessed by methods within the same class. Members declared as `private` cannot be accessed directly from outside the class.







### **Key Characteristics:**



- Provides the highest level of data hiding.



- Essential for encapsulation.



- Typically used for data that should not be modified directly from outside the class (e.g., sensitive information).







### **Syntax:**



```cpp



class MyClass {



private:



    int privateVar;







    void displayPrivateVar() {



        std::cout << "Private Variable: " << privateVar << std::endl;



    }



};



```







### **Example:**



```cpp



#include <iostream>



using namespace std;







class BankAccount {



private:



    double balance;  // Private member







public:



    BankAccount(double initialBalance) {



        if (initialBalance > 0) {



            balance = initialBalance;



        } else {



            balance = 0;



        }



    }







    void deposit(double amount) {



        if (amount > 0) {



            balance += amount;



        }



    }







    void withdraw(double amount) {



        if (amount > 0 && amount <= balance) {



            balance -= amount;



        }



    }







    double getBalance() const {



        return balance; // Accessing private data through a public method



    }



};







int main() {



    BankAccount account(1000.0);



    account.deposit(500.0);



    account.withdraw(200.0);







    cout << "Current balance: " << account.getBalance() << endl;



    return 0;



}



```







### **Output:**



```



Current balance: 1300



```







Here, `balance` is private and can only be accessed or modified using the public methods `deposit`, `withdraw`, and `getBalance`.







---







## **4. Protected Access Specifier**







The `protected` specifier is similar to `private`, but with one key difference: members declared as `protected` can be accessed in derived classes.







### **Key Characteristics:**



- Provides controlled access for derived classes.



- Cannot be accessed directly from outside the class or its derived classes.







### **Syntax:**



```cpp



class MyClass {



protected:



    int protectedVar;







    void displayProtectedVar() {



        std::cout << "Protected Variable: " << protectedVar << std::endl;



    }



};



```







### **Example:**



```cpp



#include <iostream>



using namespace std;







class Animal {



protected:



    string species;  // Protected member







public:



    void setSpecies(string sp) {



        species = sp;



    }



};







class Dog : public Animal {



public:



    void showSpecies() {



        cout << "Species: " << species << endl;  // Accessing protected member



    }



};







int main() {



    Dog myDog;



    myDog.setSpecies("Canine");



    myDog.showSpecies();



    return 0;



}



```







### **Output:**



```



Species: Canine



```







Here, the `species` member of the `Animal` class is declared as `protected`. The derived class `Dog` can access it, but it cannot be accessed directly in the `main` function.







---







## **5. Comparison of Access Specifiers**







| **Specifier** | **Access Within Class** | **Access in Derived Classes** | **Access Outside Class** |



|---------------|--------------------------|--------------------------------|---------------------------|



| **Public**    | Yes                      | Yes                            | Yes                       |



| **Private**   | Yes                      | No                             | No                        |



| **Protected** | Yes                      | Yes                            | No                        |







---







## **6. Encapsulation and Access Specifiers**







Encapsulation in C++ ensures that data is hidden from unauthorized access. By combining `private` and `public` members, you can control how data is exposed:







- Use `private` for sensitive data.



- Provide `public` methods (getters and setters) to safely access or modify `private` data.







### **Example:**



```cpp



#include <iostream>



using namespace std;







class Employee {



private:



    int id;



    double salary;







public:



    void setId(int empId) {



        id = empId;

    void setSalary(double empSalary) {



        salary = empSalary;



    }







    void display() {



        cout << "Employee ID: " << id << ", Salary: " << salary << endl;



    }



};







int main() {



    Employee emp;



    emp.setId(101);



    emp.setSalary(50000.0);



    emp.display();



    return 0;



}



```

### **Constructors and Destructors**







In C++, constructors and destructors are special member functions that handle the initialization and cleanup of objects. These functions are essential for resource management, ensuring that objects are properly set up and cleaned up during their lifecycle. Let's explore the types of constructors and the role of destructors in detail.







---







### **1. Constructors**



A constructor is a special member function with the same name as the class. It is automatically called when an object of the class is created. Constructors are primarily used to initialize objects.







#### **Characteristics of Constructors**:



- They have the same name as the class.



- They do not have a return type.



- They can be overloaded.



- They are invoked automatically when an object is created.







In C++, **overloading** means that you can define multiple functions or operators with the **same name** but with **different arguments** (number or types). Overloading is a way to give multiple definitions to the same functionality, depending on the context.







### For example:



**Function Overloading**: You can have multiple versions of the same function name that accept different parameters.







---







In the context of **constructors and the assignment operator**:







1. **Constructors** can be overloaded:



   - You can define multiple constructors in a class with different parameter lists, enabling objects to be initialized in different ways.



   - For example:



     ```cpp



     class Student {



     public:



         // Constructor 1: No arguments



         Student() {



             cout << "Default constructor called" << endl;



         }







         // Constructor 2: With one argument



         Student(string name) {



             cout << "Constructor with name: " << name << endl;



         }







         // Constructor 3: With two arguments



         Student(string name, int age) {



             cout << "Constructor with name and age: " << name << ", " << age << endl;



         }



     };



     ```







   **Use**:



   ```cpp



   Student s1;              // Calls Constructor 1



   Student s2("Arjun");     // Calls Constructor 2



   Student s3("Yashvi", 20); // Calls Constructor 3



   ```







---



#### **Types of Constructors**







---







#### **1.1 Default Constructor**



A default constructor is a constructor that takes no arguments. It initializes an object with default values.

In the CodingGita BTech program, imagine a scenario where we create a default student profile.

---







#### **1.2 Parameterized Constructor**



A parameterized constructor takes arguments and allows the programmer to initialize objects with specific values.







**Example from CodingGita:**  



Imagine assigning details to a student in CodingGita's database.

#include <iostream>

#### **1.3 Copy Constructor**



A **copy constructor** creates a new object as a copy of an existing object. The default copy constructor provided by the compiler performs a shallow copy, which can lead to issues when the object contains dynamically allocated memory or other non-trivial resources. Defining a custom copy constructor allows for a deep copy, ensuring proper duplication of all resources owned by the original object.







**Why do we need a copy constructor?**



- To avoid sharing memory between objects, which can lead to data corruption or memory errors.



- To ensure proper duplication of dynamically allocated resources.







- **Shallow Copy**: Copies the memory addresses (pointers) instead of the actual data. If one object changes the data, it affects the other because both objects share the same memory. **(Default behavior of copy constructor)**







- **Deep Copy**: Creates a new copy of the data in a different memory location. Both objects have their own separate copies of the data, avoiding unintended changes. **(Requires a custom copy constructor)**







---







**Example from CodingGita: Deep Copy Implementation**







```cpp



#include <iostream>



using namespace std;







class Student {



private:



    string name;



    int mark1, mark2; // Separate variables for marks







public:



    // Parameterized Constructor



    Student(string n, int m1, int m2) : name(n), mark1(m1), mark2(m2) {}







    // Copy Constructor



    Student(const Student &s) : name(s.name), mark1(s.mark1), mark2(s.mark2) {}







    void display() {



        cout << "Name: " << name << ", Marks: " << mark1 << ", " << mark2 << endl;



    }



};







int main() {



    Student student1("Arjun", 85, 90);







    Student student2 = student1; // Copy constructor is called







    student1.display();



    student2.display();







    return 0;



}







```







**Output:**



```



Name: Arjun, Marks: 85 90 95 



Name: Arjun, Marks: 85 90 95 



```







**What does the `&` symbol mean in the copy constructor?**



The `&` in the parameter `const Student &s` indicates passing by reference, avoiding infinite recursion and unnecessary copying. The `const` ensures the original object is not modified.







---







### **2. Destructor**







A **destructor** is a special member function that is called automatically when an object goes out of scope or is explicitly deleted. Its primary purpose is to release resources allocated to the object.







#### **Characteristics of Destructors**:



- They have the same name as the class, preceded by a tilde (~).

# Pass by Value and Pass by Reference in C++







Passing arguments to functions is a fundamental concept in C++ programming. Understanding **pass by value** and **pass by reference** is essential for writing efficient and predictable code. This article explains these concepts in detail, including their behavior, use cases, advantages, and examples.







---







## **Pass by Value**







### **What is Pass by Value?**



In **pass by value**, a copy of the actual argument is created and passed to the function. This means that any changes made to the parameter inside the function do **not** affect the original variable in the calling environment.







### **Key Characteristics**



- A copy of the argument is made.



- Changes inside the function do not affect the original variable.



- Simple to use and safe, as it protects the original data.



- Can be inefficient for large objects due to the overhead of copying.







### **Example of Pass by Value**



```cpp



#include <iostream>



using namespace std;







void modify(int x) { // Pass by value



    x = 20; // Modifies only the copy



}







int main() {



    int a = 10;



    modify(a);



    cout << "Value of a: " << a << endl; // Output: Value of a: 10



    return 0;



}



```



#### **Explanation:**



- The function `modify` receives a copy of `a`.



- Changes made to `x` do not affect the original variable `a`.







---







## **Pass by Reference**







### **What is Pass by Reference?**



In **pass by reference**, the actual memory address (reference) of the argument is passed to the function. This means that the function operates directly on the original variable, and any changes made inside the function **will affect** the original variable.







### **Key Characteristics**



- No copy of the argument is made.



- The function operates on the original variable.



- Efficient for large objects, as no additional memory is used for copying.



- Can lead to unintended modifications if not handled carefully.







### **Example of Pass by Reference**



```cpp



#include <iostream>



using namespace std;







void modify(int &x) { // Pass by reference



    x = 20; // Modifies the original variable



}







int main() {



    int a = 10;



    modify(a);



    cout << "Value of a: " << a << endl; // Output: Value of a: 20



    return 0;



}



```



#### **Explanation:**



- The function `modify` receives a reference to `a`.



- Changes made to `x` directly modify the original variable `a`.







---







## **Comparison of Pass by Value and Pass by Reference**







| **Feature**             | **Pass by Value**                    | **Pass by Reference**               |



|-------------------------|---------------------------------------|--------------------------------------|



| **Copies Argument**     | Yes                                  | No                                   |



| **Affects Original?**   | No                                   | Yes                                  |



| **Memory Efficiency**   | Low (due to copying)                 | High (no copying)                    |



| **Risk of Side Effects**| None                                 | Possible if not carefully managed    |



| **Use Case**            | Small/primitive data types           | Large objects or when modification is needed |







---







## **Practical Applications**







### **When to Use Pass by Value?**



- When the function does not need to modify the original data.



- For small and simple data types (e.g., `int`, `float`, `char`).



- When safety and simplicity are more important than efficiency.







### **When to Use Pass by Reference?**



- When the function needs to modify the original variable.



- For large objects like arrays, vectors, or user-defined classes to avoid copying overhead.



- When you want the function to work directly on the original data for efficiency.







---







## **Const Reference: A Safer Pass by Reference**



To avoid unintended modifications while still benefiting from the efficiency of pass by reference, you can use a **const reference**.







### **Example of Const Reference**



```cpp



#include <iostream>



using namespace std;







void print(const int &x) { // Const reference prevents modification



    cout << "Value: " << x << endl;



    // x = 20; // Error: cannot modify a const reference



}







int main() {



    int a = 10;



    print(a);



    cout << "Value of a: " << a << endl; // Output: Value of a: 10



    return 0;



}



```



#### **Explanation:**



- The `const` keyword ensures that the function `print` cannot modify the original variable `a`.



- This is useful when you need to pass large objects by reference for efficiency but want to ensure that the function does not alter them.







---







## **Real-World Example: Pass by Reference in Copy Constructors**



Copy constructors in C++ often use pass by reference to avoid unnecessary copying and infinite recursion.







### **Example of Custom Copy Constructor**



```cpp



#include <iostream>



using namespace std;







class Student {



private:



    string name;







public:



    Student(const string &n) : name(n) {}







    // Copy constructor: Pass by reference



    Student(const Student &s) : name(s.name) {



        cout << "Copy constructor called" << endl;



    }







    void display() const {



        cout << "Name: " << name << endl;



    }



};







int main() {



    Student student1("Arjun");



    Student student2 = student1; // Copy constructor is called







    student1.display();



    student2.display();







    return 0;



}



```



#### **Why Pass by Reference in Copy Constructor?**



- **Efficiency:** Avoids copying the entire object, especially for large objects.



- **Prevents Infinite Recursion:** If a copy constructor used pass by value, it would call itself repeatedly to copy the argument, leading to a stack overflow.







---







## **Summary**



- **Pass by Value** creates a copy of the argument, ensuring the original data remains unchanged but may be inefficient for large objects.



- **Pass by Reference** allows direct modification of the original data and is more efficient but requires careful handling to avoid side effects.



- Use **const references** when you want efficiency without allowing modifications.



- Choose the appropriate method based on the use case: safety and simplicity for small data types, or efficiency and mutability for large objects.







Understanding the distinction between these two methods helps you write better, more efficient, and safer C++ programs.



















## Static Members in C++







### What are Static Members?



- **Static members** in a class are shared among all instances of the class, meaning they belong to the class itself, not to any specific object.



- They are defined using the keyword `static`.







There are two types of static members:



1. **Static Variables**



2. **Static Functions**







---







### 1. **Static Variables**







#### Features:



- **Single copy for all objects**: A static variable is shared among all objects of a class. Changing its value in one object will reflect in all other objects.



- **Lifetime**: It persists throughout the program's execution (similar to global variables).



- **Memory allocation**: Static variables are allocated in a fixed location (not in the stack or heap).



- **Initialization**: Static variables must be explicitly initialized outside the class definition.







#### Example: Static Variables



```cpp



#include <iostream>



using namespace std;







class Counter {



private:



    static int count; // Declaration of static variable







public:



    // Increment the counter



    void increment() {



        count++;



    }







    // Display the current count



    void display() {



        cout << "Current Count: " << count << endl;



    }



};







// Initialization of static variable



int Counter::count = 0;







int main() {



    Counter obj1, obj2;







    obj1.increment(); // Increments count to 1



    obj1.display();   // Output: Current Count: 1







    obj2.increment(); // Increments count to 2 (shared by obj1 and obj2)



    obj2.display();   // Output: Current Count: 2







    return 0;



}



```







#### Explanation:



- `int Counter::count = 0;`: The static variable `count` is defined and initialized outside the class.



- Both `obj1` and `obj2` share the same `count` variable. When `obj2` increments `count`, it reflects for `obj1` as well.







---







### 2. **Static Functions**







#### Features:



- **Class-specific**: Static functions belong to the class rather than an instance.



- **No access to non-static members**: They can only access other static variables or call static functions because they do not operate on an instance.



- **Called using the class name**: You don’t need an object to call a static function.







#### Example: Static Functions



```cpp



#include <iostream>



using namespace std;







class Utility {



public:



    // Static function to add two numbers



    static int add(int a, int b) {



        return a + b;



    }







    // Static function to calculate the square of a number



    static int square(int num) {



        return num * num;



    }



};







int main() {



    // Calling static functions without creating an object



    cout << "Sum: " << Utility::add(10, 20) << endl;       // Output: Sum: 30



    cout << "Square: " << Utility::square(5) << endl;     // Output: Square: 25







    return 0;



}



```







#### Explanation:



- Static functions like `add` and `square` do not require an object of the class to be called. They are called directly using the class name (`Utility::add`).







---







### Accessing Static Members







#### Accessing Static Variables



1. **Outside the Class**:



   Static variables are accessed using the `ClassName::VariableName` syntax (e.g., `Counter::count`).



2. **Inside the Class**:



   Static variables can be accessed directly if the function accessing them is also static. Otherwise, they need an object or class name for access.







#### Accessing Static Functions



1. **Directly with the Class Name**:



   Use `ClassName::FunctionName` (e.g., `Utility::add`).



2. **Optional with Objects**:



   You can also use an object to call a static function, but it's not recommended as it defeats the purpose of static.







---







### Example: Static Members (Combined)



```cpp



#include <iostream>



using namespace std;







class Bank {



private:



    static int totalAccounts; // Static variable to keep track of all accounts







public:



    // Constructor increments total accounts



    Bank() {



        totalAccounts++;



    }







    // Static function to display total accounts



    static void displayTotalAccounts() {



        cout << "Total Bank Accounts: " << totalAccounts << endl;



    }



};







// Initialize the static variable



int Bank::totalAccounts = 0;







int main() {



    Bank acc1, acc2, acc3;







    // Call static function using the class name



    Bank::displayTotalAccounts(); // Output: Total Bank Accounts: 3







    return 0;



}



```







#### Explanation:



- The static variable `totalAccounts` is incremented every time a new object is created.



- The static function `displayTotalAccounts` shows the total count of accounts.







---







### Key Points to Remember:



1. **Static Variables**:



   - Shared by all objects of the class.



   - Need to be initialized outside the class.



   - Can be accessed using the class name (`ClassName::StaticVariable`).







2. **Static Functions**:



   - Belong to the class, not an instance.



   - Cannot access non-static variables or call non-static functions.



   - Can be called using the class name (`ClassName::StaticFunction`).







3. **Memory Management**:



   - Static members are stored in a fixed memory location for the program's lifetime.







---







### Real-World Analogy







Imagine a **bank** where:



- **Static Variable**: The total number of accounts is shared across all branches of the bank. No matter which branch creates an account, it updates the same total count.



- **Static Function**: A function to fetch the total number of accounts is available for all branches, but it does not depend on any single branch (or object).







This is how static variables and functions provide global functionality to a class.

### **Inheritance in Depth**







Inheritance is a key feature of Object-Oriented Programming (OOP) that allows a class (called the derived class) to inherit properties and behaviors from another class (called the base class). This promotes **code reusability, hierarchical structuring, and extensibility**. 







In this article, we will dive deep into inheritance, covering different types, access specifiers, and the behavior of constructors and destructors in inheritance.







---







## **1. Types of Inheritance in C++**



C++ supports five types of inheritance:







### **A. Single Inheritance**



In single inheritance, a derived class inherits from a single base class.







#### **Example:**



```cpp



#include <iostream>



using namespace std;







// Base class



class Vehicle {



public:



    void display() {



        cout << "This is a Vehicle." << endl;



    }



};







// Derived class



class Car : public Vehicle {



public:



    void show() {



        cout << "This is a Car." << endl;



    }



};







int main() {



    Car obj;



    obj.display(); // Inherited function



    obj.show();    // Function from derived class



    return 0;



}



```







**Output:**



```



This is a Vehicle.



This is a Car.



```







---







### **B. Multiple Inheritance**



A derived class inherits from multiple base classes.







#### **Example:**



```cpp



#include <iostream>



using namespace std;







class Engine {



public:



    void engineType() {



        cout << "Engine: V8" << endl;



    }



};







class Transmission {



public:



    void transmissionType() {



        cout << "Transmission: Automatic" << endl;



    }



};







// Derived class inheriting from two base classes



class SportsCar : public Engine, public Transmission {



public:



    void carType() {



        cout << "Car Type: Sports Car" << endl;



    }



};







int main() {



    SportsCar obj;



    obj.carType();



    obj.engineType();



    obj.transmissionType();



    return 0;



}



```







---







### **C. Multilevel Inheritance**



A derived class inherits from another derived class.







#### **Example:**



```cpp



#include <iostream>



using namespace std;







class GrandParent {



public:



    void grandParentFunction() {



        cout << "Grandparent Function" << endl;



    }



};







class Parent : public GrandParent {



public:



    void parentFunction() {



        cout << "Parent Function" << endl;



    }



};







class Child : public Parent {



public:



    void childFunction() {



        cout << "Child Function" << endl;



    }



};







int main() {



    Child obj;



    obj.grandParentFunction();



    obj.parentFunction();



    obj.childFunction();



    return 0;



}



```







---







### **D. Hierarchical Inheritance**



Multiple derived classes inherit from a single base class.







#### **Example:**



```cpp



#include <iostream>



using namespace std;







class Animal {



public:



    void eat() {



        cout << "Eating..." << endl;



    }



};







class Dog : public Animal {



public:

    }



};

public:
